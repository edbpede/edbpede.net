# The test tier: the Playwright end-to-end run against the real static build.
#
# This site is a single prerendered page whose whole job is to send visitors to
# five subdomains, so there is no unit-testable logic and no `bun test` suite —
# the browser suite in e2e/ is the entire behavioural gate. It asserts the five
# destinations, the marks that identify them, the hover descriptions, that the
# assets actually decode, and that the page still ships zero JavaScript.
#
# Formatting, lint, types and the plain build live in code-quality.yml, and the
# no-browser build/serve/load probe in smoke.yml. Nothing is duplicated here.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Derived from the committed `packageManager` field, not `latest`.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # playwright.config.ts builds nothing — it only serves dist/ — so the
      # suite runs against whatever this step produced.
      - name: Build
        run: bun run build

      - name: Install browsers
        run: bunx --bun playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # Both: playwright-report/ is the HTML report, test-results/ holds the
          # trace zips that `trace: "on-first-retry"` produces on a CI failure.
          path: |
            playwright-report/
            test-results/
          retention-days: 7
